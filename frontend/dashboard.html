<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Organizer Dashboard - EventX</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg sticky-top">
        <div class="container">
            <a class="navbar-brand" href="index.html">EventX</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto align-items-center" id="nav-right"></ul>
            </div>
        </div>
    </nav>

    <div id="alert-container"></div>

    <div class="container mt-5 pt-3 pb-5">
        <div class="d-flex justify-content-between align-items-center mb-5 animate-fade-in">
            <div>
                <h2 class="fw-bold text-dark mb-1">Organizer Dashboard</h2>
                <p class="text-muted mb-0">Manage your events and ticket categories.</p>
            </div>
            <button class="btn btn-primary px-4 py-2 fw-bold shadow-sm" data-bs-toggle="modal" data-bs-target="#eventModal" onclick="resetEventForm()">
                + Create New Event
            </button>
        </div>

        <div class="row g-4" id="my-events-list">
            <div class="col-12 text-center py-5">
                <div class="loader"></div>
                <p class="mt-3 text-muted">Loading your events...</p>
            </div>
        </div>
    </div>

    <!-- Event Modal -->
    <div class="modal fade" id="eventModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content border-0 shadow-lg rounded-4">
                <form id="event-form">
                    <div class="modal-header border-bottom-0 pb-0 px-4 pt-4">
                        <h4 class="modal-title fw-bold" id="eventModalTitle">Create Event</h4>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body px-4 py-4">
                        <input type="hidden" id="event-id">
                        
                        <div class="mb-4">
                            <label class="form-label fw-bold text-muted small text-uppercase">Event Title</label>
                            <input type="text" class="form-control" id="event-title" required placeholder="e.g. Summer Music Festival">
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-bold text-muted small text-uppercase">Description</label>
                            <textarea class="form-control" id="event-desc" rows="3" placeholder="Tell attendees what to expect..."></textarea>
                        </div>
                        
                        <div class="row g-4 mb-4">
                            <div class="col-md-6">
                                <label class="form-label fw-bold text-muted small text-uppercase">Date</label>
                                <input type="date" class="form-control" id="event-date" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-bold text-muted small text-uppercase">Category</label>
                                <input type="text" class="form-control" id="event-category" required placeholder="e.g. Concert, Tech, Arts">
                            </div>
                        </div>
                        
                        <div class="row g-4">
                            <div class="col-md-6">
                                <label class="form-label fw-bold text-muted small text-uppercase">Venue</label>
                                <input type="text" class="form-control" id="event-venue" required placeholder="e.g. Madison Square Garden">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-bold text-muted small text-uppercase">City</label>
                                <input type="text" class="form-control" id="event-city" required placeholder="e.g. New York">
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer border-top-0 px-4 pb-4">
                        <button type="button" class="btn btn-light px-4" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-primary px-4 fw-bold shadow-sm">Save Event</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Category Modal -->
    <div class="modal fade" id="categoryModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow-lg rounded-4">
                <form id="category-form">
                    <div class="modal-header border-bottom-0 pb-0 px-4 pt-4">
                        <h5 class="modal-title fw-bold" id="catModalTitle">Add Ticket Category</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body px-4 py-4">
                        <input type="hidden" id="cat-event-id">
                        <input type="hidden" id="cat-id">
                        
                        <div class="mb-4">
                            <label class="form-label fw-bold text-muted small text-uppercase">Category Name</label>
                            <input type="text" class="form-control" id="cat-name" required placeholder="e.g. VIP, General Admission">
                        </div>
                        <div class="row g-3">
                            <div class="col-6">
                                <label class="form-label fw-bold text-muted small text-uppercase">Price ($)</label>
                                <input type="number" step="0.01" class="form-control" id="cat-price" min="0" required placeholder="0.00">
                            </div>
                            <div class="col-6">
                                <label class="form-label fw-bold text-muted small text-uppercase">Ticket Quota</label>
                                <input type="number" class="form-control" id="cat-quota" min="1" required placeholder="100">
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer border-top-0 px-4 pb-4">
                        <button type="button" class="btn btn-light px-4" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-dark px-4 fw-bold">Save Category</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
    <script>
        // Restrict access
        const user = getUser();
        if (!user || user.role !== 'organizer') {
            window.location.href = 'index.html';
        }

        const eventModal = new bootstrap.Modal(document.getElementById('eventModal'));
        const categoryModal = new bootstrap.Modal(document.getElementById('categoryModal'));

        function resetEventForm() {
            document.getElementById('event-form').reset();
            document.getElementById('event-id').value = '';
            document.getElementById('eventModalTitle').textContent = 'Create Event';
        }

        async function loadMyEvents() {
            try {
                // Fetch all events for now since this is a simple demo
                const data = await apiFetch('/events/search');
                let events = data.data?.events || data.events || data;
                
                const list = document.getElementById('my-events-list');
                list.innerHTML = '';
                
                if (!Array.isArray(events) || events.length === 0) {
                    list.innerHTML = `
                        <div class="col-12 text-center py-5">
                            <div class="p-5 bg-white rounded-4 shadow-sm border text-muted">
                                <h4 class="fw-bold mb-3">No events found</h4>
                                <p>You haven't created any events yet.</p>
                                <button class="btn btn-primary mt-2" onclick="document.querySelector('[data-bs-target=\\'#eventModal\\']').click()">Create Your First Event</button>
                            </div>
                        </div>`;
                    return;
                }

                events.forEach((event, index) => {
                    const eventId = event._id || event.id;
                    const el = document.createElement('div');
                    el.className = 'col-12 animate-fade-in';
                    el.style.animationDelay = `${index * 0.1}s`;
                    
                    const safeEvent = JSON.stringify(event).replace(/'/g, "&#39;").replace(/"/g, "&quot;");
                    
                    el.innerHTML = `
                        <div class="glass-panel p-0 overflow-hidden">
                            <div class="p-4 p-md-5 d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-4">
                                <div>
                                    <span class="badge bg-primary bg-opacity-10 text-primary mb-2 px-3 py-2 rounded-pill">${event.category || 'Event'}</span>
                                    <h3 class="fw-bold text-dark mb-2">${event.title}</h3>
                                    <div class="d-flex flex-wrap gap-3 text-muted fw-medium mb-3">
                                        <span>📍 ${event.venue}, ${event.city}</span>
                                        <span>📅 ${new Date(event.date).toLocaleDateString()}</span>
                                    </div>
                                    <p class="mb-0 text-secondary">${event.description || 'No description provided.'}</p>
                                </div>
                                <div class="d-flex flex-row flex-md-column gap-2 flex-shrink-0">
                                    <button class="btn btn-outline-dark fw-bold px-4" onclick='editEvent(${safeEvent})'>Edit Event</button>
                                    <button class="btn btn-outline-danger fw-bold px-4" onclick="deleteEvent('${eventId}')">Delete</button>
                                </div>
                            </div>
                            
                            <div class="bg-light p-4 p-md-5 border-top">
                                <div class="d-flex justify-content-between align-items-center mb-4">
                                    <h5 class="fw-bold text-dark mb-0">🎟️ Ticket Categories</h5>
                                    <button class="btn btn-dark btn-sm fw-bold px-3 py-2 shadow-sm rounded-pill" onclick="openCategoryModal('${eventId}')">
                                        + Add Category
                                    </button>
                                </div>
                                
                                <div class="table-responsive bg-white rounded-3 border shadow-sm">
                                    <table class="table table-hover align-middle mb-0">
                                        <thead class="table-light">
                                            <tr>
                                                <th class="ps-4 py-3 text-uppercase small fw-bold text-muted">Type</th>
                                                <th class="py-3 text-uppercase small fw-bold text-muted">Price</th>
                                                <th class="py-3 text-uppercase small fw-bold text-muted">Quota</th>
                                                <th class="pe-4 py-3 text-end text-uppercase small fw-bold text-muted">Manage</th>
                                            </tr>
                                        </thead>
                                        <tbody id="cats-${eventId}">
                                            <tr><td colspan="4" class="text-center text-muted py-4">
                                                <div class="spinner-border spinner-border-sm text-primary" role="status"></div>
                                                <span class="ms-2">Loading categories...</span>
                                            </td></tr>
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    `;
                    list.appendChild(el);
                    loadCategories(eventId);
                });
            } catch (e) {
                document.getElementById('my-events-list').innerHTML = `<div class="col-12"><div class="alert alert-danger shadow-sm">Error loading events: ${e.message}</div></div>`;
            }
        }

        async function loadCategories(eventId) {
            try {
                const data = await apiFetch(`/events/${eventId}/categories`);
                const cats = data.categories || data.data || data;
                const tbody = document.getElementById(`cats-${eventId}`);
                
                if (!Array.isArray(cats) || cats.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="4" class="text-center text-muted py-4">No ticket categories added yet. Add one to start selling tickets!</td></tr>';
                    return;
                }
                
                tbody.innerHTML = cats.map(c => {
                    const catId = c._id || c.id;
                    const safeCat = JSON.stringify(c).replace(/'/g, "&#39;").replace(/"/g, "&quot;");
                    return `
                        <tr>
                            <td class="ps-4 fw-bold text-dark">${c.name}</td>
                            <td class="text-success fw-bold">$${c.price}</td>
                            <td><span class="badge bg-secondary">${c.quota}</span> tickets</td>
                            <td class="pe-4 text-end">
                                <button class="btn btn-sm btn-light border text-dark fw-bold me-2" onclick='editCategory("${eventId}", ${safeCat})'>Edit</button>
                                <button class="btn btn-sm btn-light border text-danger fw-bold" onclick="deleteCategory('${catId}', '${eventId}')">Delete</button>
                            </td>
                        </tr>
                    `;
                }).join('');
            } catch (e) {
                document.getElementById(`cats-${eventId}`).innerHTML = `<tr><td colspan="4" class="text-center text-danger py-3">Failed to load ticket categories.</td></tr>`;
            }
        }

        // Event Form Submit
        document.getElementById('event-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('event-id').value;
            const payload = {
                title: document.getElementById('event-title').value,
                description: document.getElementById('event-desc').value,
                date: document.getElementById('event-date').value,
                category: document.getElementById('event-category').value,
                venue: document.getElementById('event-venue').value,
                city: document.getElementById('event-city').value
            };
            
            try {
                if (id) {
                    await apiFetch(`/events/${id}`, { method: 'PUT', body: JSON.stringify(payload) });
                    showAlert('Event updated successfully', 'success');
                } else {
                    await apiFetch('/events', { method: 'POST', body: JSON.stringify(payload) });
                    showAlert('Event created successfully', 'success');
                }
                eventModal.hide();
                loadMyEvents();
            } catch (e) {
                // error handled by apiFetch
            }
        });

        function editEvent(event) {
            document.getElementById('event-id').value = event._id || event.id;
            document.getElementById('event-title').value = event.title || '';
            document.getElementById('event-desc').value = event.description || '';
            document.getElementById('event-date').value = event.date ? event.date.split('T')[0] : '';
            document.getElementById('event-category').value = event.category || '';
            document.getElementById('event-venue').value = event.venue || '';
            document.getElementById('event-city').value = event.city || '';
            document.getElementById('eventModalTitle').textContent = 'Edit Event';
            eventModal.show();
        }

        async function deleteEvent(id) {
            if (!confirm('Are you sure you want to permanently delete this event? This action cannot be undone.')) return;
            try {
                await apiFetch(`/events/${id}`, { method: 'DELETE' });
                showAlert('Event deleted successfully.', 'success');
                loadMyEvents();
            } catch (e) {}
        }

        // Category Form Submit
        function openCategoryModal(eventId) {
            document.getElementById('category-form').reset();
            document.getElementById('cat-id').value = '';
            document.getElementById('cat-event-id').value = eventId;
            document.getElementById('catModalTitle').textContent = 'Add Ticket Category';
            categoryModal.show();
        }

        function editCategory(eventId, cat) {
            document.getElementById('cat-id').value = cat._id || cat.id;
            document.getElementById('cat-event-id').value = eventId;
            document.getElementById('cat-name').value = cat.name || '';
            document.getElementById('cat-price').value = cat.price || 0;
            document.getElementById('cat-quota').value = cat.quota || 1;
            document.getElementById('catModalTitle').textContent = 'Edit Ticket Category';
            categoryModal.show();
        }

        document.getElementById('category-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('cat-id').value;
            const eventId = document.getElementById('cat-event-id').value;
            const payload = {
                name: document.getElementById('cat-name').value,
                price: Number(document.getElementById('cat-price').value),
                quota: Number(document.getElementById('cat-quota').value)
            };
            
            try {
                if (id) {
                    await apiFetch(`/categories/${id}`, { method: 'PUT', body: JSON.stringify(payload) });
                    showAlert('Ticket category updated.', 'success');
                } else {
                    await apiFetch(`/events/${eventId}/categories`, { method: 'POST', body: JSON.stringify(payload) });
                    showAlert('Ticket category added successfully.', 'success');
                }
                categoryModal.hide();
                loadCategories(eventId);
            } catch (e) {}
        });

        async function deleteCategory(id, eventId) {
            if (!confirm('Delete this ticket category?')) return;
            try {
                await apiFetch(`/categories/${id}`, { method: 'DELETE' });
                showAlert('Category deleted.', 'success');
                loadCategories(eventId);
            } catch (e) {}
        }

        document.addEventListener('DOMContentLoaded', loadMyEvents);
    </script>
</body>
</html>
