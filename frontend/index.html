<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Events Discovery - EventX</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg sticky-top">
        <div class="container">
            <a class="navbar-brand" href="index.html">EventX</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto align-items-center" id="nav-right">
                    <!-- Populated by app.js -->
                </ul>
            </div>
        </div>
    </nav>

    <div id="alert-container"></div>

    <div class="container mt-5 pt-3">

        <div class="text-center mb-5 animate-fade-in">
            <h1 class="display-4 fw-bold mb-3 text-dark">Discover Amazing Events</h1>
            <p class="lead text-muted">Find and book the best experiences in your city.</p>
        </div>

        <!-- Filters -->
        <div class="glass-panel mb-5 animate-fade-in" style="animation-delay: 0.1s">
            <form id="filter-form" class="row g-3 align-items-end">
                <div class="col-md-3">
                    <label class="form-label text-muted small fw-bold text-uppercase">City</label>
                    <input type="text" class="form-control" id="filter-city" placeholder="e.g. New York">
                </div>
                <div class="col-md-3">
                    <label class="form-label text-muted small fw-bold text-uppercase">Category</label>
                    <input type="text" class="form-control" id="filter-category" placeholder="e.g. Music">
                </div>
                <div class="col-md-3">
                    <label class="form-label text-muted small fw-bold text-uppercase">Date</label>
                    <input type="date" class="form-control" id="filter-date">
                </div>
                <div class="col-md-3">
                    <button type="submit" class="btn btn-primary w-100 py-2 shadow-sm">Search Events</button>
                </div>
            </form>
        </div>

        <div id="events-loading" class="text-center d-none my-5 py-5">
            <div class="loader"></div>
            <p class="mt-3 text-muted fw-medium">Fetching events...</p>
        </div>

        <div class="row g-4 pb-5" id="events-list">
            <!-- Events populated here -->
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
    <script>
        async function loadEvents(params = '') {
            const list = document.getElementById('events-list');
            const loading = document.getElementById('events-loading');

            list.innerHTML = '';
            loading.classList.remove('d-none');

            try {
                const data = await apiFetch(`/events/search${params}`);
                const events = data.data?.events || data.events || data;

                if (!Array.isArray(events) || events.length === 0) {
                    list.innerHTML = '<div class="col-12 text-center text-muted py-5 my-5"><h4 class="fw-bold">No events found.</h4><p>Try adjusting your search filters.</p></div>';
                } else {
                    events.forEach((event, index) => {
                        const card = document.createElement('div');
                        card.className = 'col-lg-4 col-md-6 animate-fade-in';
                        card.style.animationDelay = `${index * 0.05}s`;
                        card.innerHTML = `
                            <div class="card h-100 d-flex flex-column">
                                <div class="card-body p-4 flex-grow-1">
                                    <span class="badge bg-primary bg-opacity-10 text-primary mb-3 px-3 py-2 rounded-pill">${event.category || 'Event'}</span>
                                    <h4 class="card-title fw-bold mb-3">${event.title}</h4>
                                    <p class="card-text text-muted mb-4 line-clamp-3">${event.description || 'No description provided.'}</p>

                                    <div class="d-flex align-items-center mb-2 text-dark fw-medium">
                                        <span class="me-2 fs-5">📍</span>
                                        <span>${event.venue}, ${event.city}</span>
                                    </div>
                                    <div class="d-flex align-items-center text-dark fw-medium">
                                        <span class="me-2 fs-5">📅</span>
                                        <span>${new Date(event.date).toLocaleDateString(undefined, { weekday: 'short', year: 'numeric', month: 'short', day: 'numeric' })}</span>
                                    </div>
                                </div>
                                <div class="card-footer bg-transparent border-top-0 p-4 pt-0">
                                    <button class="btn btn-outline-primary w-100 py-2 fw-bold" onclick="alert('Booking, tickets, and check-in are handled by Member 2 / Sprint 2 modules.')">View Tickets</button>
                                </div>
                            </div>
                        `;
                        list.appendChild(card);
                    });
                }
            } catch (err) {
                // error handled by apiFetch
                list.innerHTML = '<div class="col-12 text-center text-danger py-5">Failed to load events. Is the backend running?</div>';
            } finally {
                loading.classList.add('d-none');
            }
        }

        document.getElementById('filter-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const city = document.getElementById('filter-city').value.trim();
            const category = document.getElementById('filter-category').value.trim();
            const date = document.getElementById('filter-date').value;

            const params = new URLSearchParams();
            if (city) params.append('city', city);
            if (category) params.append('category', category);
            if (date) params.append('date', date);

            const queryString = params.toString() ? `?${params.toString()}` : '';
            loadEvents(queryString);
        });

        document.addEventListener('DOMContentLoaded', () => loadEvents());
    </script>
</body>
</html>
