<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - EventX</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg sticky-top">
        <div class="container">

            <a class="navbar-brand" href="index.html">
                EventX
            </a>

            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNav"
            >
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul
                    class="navbar-nav ms-auto align-items-center"
                    id="nav-right"
                ></ul>
            </div>

        </div>
    </nav>

    <!-- Alerts -->
    <div id="alert-container"></div>

    <!-- Login -->
    <div class="container mt-5 pt-4">

        <div class="row justify-content-center">

            <div class="col-lg-5 col-md-7">

                <div class="glass-panel animate-fade-in p-5">

                    <div class="text-center mb-4">

                        <h2 class="fw-bold text-dark">
                            Welcome Back
                        </h2>

                        <p class="text-muted">
                            Sign in to continue to EventX
                        </p>

                    </div>

                    <form id="login-form">

                        <!-- Email -->
                        <div class="mb-4">

                            <label
                                for="email"
                                class="form-label fw-bold text-muted small text-uppercase"
                            >
                                Email Address
                            </label>

                            <input
                                type="email"
                                class="form-control form-control-lg"
                                id="email"
                                placeholder="name@example.com"
                                required
                            >

                        </div>

                        <!-- Password -->
                        <div class="mb-5">

                            <label
                                for="password"
                                class="form-label fw-bold text-muted small text-uppercase"
                            >
                                Password
                            </label>

                            <input
                                type="password"
                                class="form-control form-control-lg"
                                id="password"
                                placeholder="••••••••"
                                required
                            >

                        </div>

                        <!-- Submit -->
                        <button
                            type="submit"
                            class="btn btn-primary w-100 py-3 mb-3 fw-bold shadow-sm"
                            id="login-btn"
                        >

                            <span
                                class="spinner-border spinner-border-sm d-none me-2"
                                id="login-spinner"
                                role="status"
                                aria-hidden="true"
                            ></span>

                            Sign In

                        </button>

                    </form>

                    <div class="text-center mt-4">

                        <p class="text-muted mb-0">
                            Don't have an account?

                            <a
                                href="register.html"
                                class="text-primary fw-bold text-decoration-none"
                            >
                                Create one
                            </a>
                        </p>

                    </div>

                </div>

            </div>

        </div>

    </div>

    <!-- Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Shared application logic -->
    <script src="app.js"></script>

    <!-- Login logic -->
    <script>

        document
            .getElementById('login-form')
            .addEventListener('submit', async (event) => {

                event.preventDefault();

                const button =
                    document.getElementById('login-btn');

                const spinner =
                    document.getElementById('login-spinner');

                button.disabled = true;
                spinner.classList.remove('d-none');

                try {

                    /*
                     * The backend response is:
                     *
                     * {
                     *   success: true,
                     *   message: "Login successful",
                     *   data: {
                     *     token: "JWT..."
                     *   }
                     * }
                     */

                    const response = await apiFetch(
                        '/auth/login',
                        {
                            method: 'POST',

                            body: JSON.stringify({
                                email:
                                    document.getElementById('email').value.trim(),

                                password:
                                    document.getElementById('password').value
                            })
                        }
                    );

                    /*
                     * Extract JWT from the actual backend response.
                     */
                    const token = response.data.token;

                    /*
                     * Decode the JWT payload.
                     *
                     * The backend places:
                     * - userId
                     * - role
                     *
                     * inside the token.
                     */

                    const tokenParts = token.split('.');

                    if (tokenParts.length !== 3) {
                        throw new Error('Invalid authentication token received.');
                    }

                    let base64Payload = tokenParts[1]
                        .replace(/-/g, '+')
                        .replace(/_/g, '/');

                    /*
                     * Add Base64 padding when required.
                     */
                    while (base64Payload.length % 4 !== 0) {
                        base64Payload += '=';
                    }

                    const payload =
                        JSON.parse(atob(base64Payload));

                    /*
                     * Create the frontend user object.
                     */
                    const user = {
                        id: payload.userId,
                        role: payload.role
                    };

                    /*
                     * Make sure the JWT contains a valid role.
                     */
                    if (!user.role) {
                        throw new Error(
                            'Login succeeded, but no user role was returned.'
                        );
                    }

                    /*
                     * Store JWT + user information in localStorage.
                     */
                    setAuth(token, user);

                    /*
                     * Redirect based on role.
                     */
                    if (user.role === 'organizer') {

                        window.location.href =
                            'dashboard.html';

                    } else {

                        window.location.href =
                            'index.html';

                    }

                } catch (error) {

                    /*
                     * apiFetch already displays API errors.
                     * This handles frontend/token errors.
                     */

                    console.error('Login error:', error);

                } finally {

                    button.disabled = false;
                    spinner.classList.add('d-none');

                }

            });

    </script>

</body>
</html>
