<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - EventX</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg sticky-top">
        <div class="container">
            <a class="navbar-brand" href="index.html">EventX</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto align-items-center" id="nav-right"></ul>
            </div>
        </div>
    </nav>

    <div id="alert-container"></div>

    <div class="container mt-5 pt-3 pb-5">
        <div class="row justify-content-center">
            <div class="col-lg-5 col-md-8">
                <div class="glass-panel animate-fade-in p-5">
                    <div class="text-center mb-4">
                        <h2 class="fw-bold text-dark">Create an Account</h2>
                        <p class="text-muted">Join EventX as an Attendee or Organizer</p>
                    </div>
                    
                    <form id="register-form">
                        <div class="mb-3">
                            <label class="form-label fw-bold text-muted small text-uppercase">Full Name</label>
                            <input type="text" class="form-control form-control-lg" id="name" placeholder="John Doe" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold text-muted small text-uppercase">Email Address</label>
                            <input type="email" class="form-control form-control-lg" id="email" placeholder="name@example.com" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold text-muted small text-uppercase">Password</label>
                            <input type="password" class="form-control form-control-lg" id="password" placeholder="••••••••" required>
                        </div>
                        <div class="mb-5">
                            <label class="form-label fw-bold text-muted small text-uppercase">I want to...</label>
                            <select class="form-select form-select-lg" id="role">
                                <option value="attendee">Attend Events</option>
                                <option value="organizer">Organize Events</option>
                            </select>
                        </div>
                        
                        <button type="submit" class="btn btn-primary w-100 py-3 fw-bold shadow-sm" id="reg-btn">
                            <span class="spinner-border spinner-border-sm d-none me-2" id="reg-spinner"></span>
                            Create Account
                        </button>
                    </form>
                    
                    <div class="text-center mt-4">
                        <p class="text-muted mb-0">Already have an account? <a href="login.html" class="text-primary fw-bold text-decoration-none">Sign in</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
    <script>
        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('reg-btn');
            const spinner = document.getElementById('reg-spinner');
            
            btn.disabled = true;
            spinner.classList.remove('d-none');
            
            try {
                await apiFetch('/auth/register', {
                    method: 'POST',
                    body: JSON.stringify({
                        name: document.getElementById('name').value,
                        email: document.getElementById('email').value,
                        password: document.getElementById('password').value,
                        role: document.getElementById('role').value
                    })
                });
                
                showAlert('Registration successful! Redirecting to login...', 'success');
                setTimeout(() => window.location.href = 'login.html', 1500);
            } catch (err) {
                // error handled
            } finally {
                btn.disabled = false;
                spinner.classList.add('d-none');
            }
        });
    </script>
</body>
</html>
